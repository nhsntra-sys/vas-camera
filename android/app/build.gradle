plugins { id 'com.android.application' }
android {
    namespace 'vn.vas.camera'
    compileSdk 34
    defaultConfig {
        applicationId 'vn.vas.camera'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VCODE') ?: '1')
        versionName "2.0." + (System.getenv('VCODE') ?: '1')
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'none.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'vas'
            keyPassword System.getenv('KS_PASS')
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
}
dependencies {
    def cx = '1.3.4'
    implementation "androidx.camera:camera-core:$cx"
    implementation "androidx.camera:camera-camera2:$cx"
    implementation "androidx.camera:camera-lifecycle:$cx"
    implementation "androidx.camera:camera-view:$cx"
    implementation "androidx.camera:camera-extensions:$cx"
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.guava:listenablefuture:1.0'
}
