/* VOICE: thợ công trường, bấm là chụp
   IDEA: kính ngắm máy ảnh chấm công, dấu chìm hiện sẵn
   PICTURE: khung ngắm toàn màn hình có dấu chìm trực tiếp
   COLOUR and TYPE: nền đen máy ảnh, nút chụp trắng, nhấn cam VAS; Roboto Condensed
   LAYOUT: thanh trên mỏng, khung ngắm giữa, hàng nút chụp dưới */
:root{color-scheme:dark;--or:#ff7a1a;--bl:#1e9bff;--card:#15171c;--line:#2a2e37;--mut:#a7adba}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font:16px/1.45 'RC',system-ui,sans-serif;overflow:hidden}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px}
.top img{height:28px;background:#fff;border-radius:6px;padding:2px 6px}
.loc{flex:1;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;text-align:left;padding:8px 0;min-height:44px;font-family:inherit}
.loc b{color:#fff;font-weight:400}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:#ffffff1a;color:#fff;font-size:20px;display:grid;place-items:center;cursor:pointer}
.stage{position:relative;display:grid;place-items:center;overflow:hidden}
.vf{position:relative;background:#111}
.vf video,.vf canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vf video{object-fit:fill}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:fl .25s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--mut)}
.msg.on{display:grid}.msg b{color:#fff;display:block;font-size:20px;margin-bottom:8px}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 24px 18px}
.thumb{width:56px;height:56px;border-radius:12px;border:2px solid #fff6;background:#222 center/cover;cursor:pointer;justify-self:start;padding:0}
.shut{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000;cursor:pointer;padding:0}
.shut:active{transform:scale(.93);background:#ddd}
.bar .ib{justify-self:end;width:52px;height:52px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:15px;box-shadow:0 8px 30px #0008;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;display:grid;gap:14px}
.panel h2{margin:0;font-size:20px;font-weight:400;display:flex;justify-content:space-between;align-items:center}
label{font-size:14px;color:var(--mut);display:grid;gap:6px}
input[type=text],textarea{font:16px 'RC',sans-serif;background:#0d0f13;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
textarea{min-height:56px;resize:vertical}
.chk{display:flex;align-items:center;gap:10px;color:#fff;font-size:16px;min-height:36px}
.chk input{width:22px;height:22px;accent-color:var(--or)}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#20242c;color:#fff;font:16px 'RC',sans-serif;cursor:pointer;padding:0 14px}
.btn.or{background:var(--or);border-color:var(--or)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1 1 140px}
.small{font-size:13px;color:var(--mut);margin:0}
.view{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:6}
.view.on{display:flex}
.view img{flex:1;min-height:0;object-fit:contain;width:100%}
.view .row{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffd27a;outline-offset:2px}
input[type=file]{display:none}
@media(prefers-reduced-motion:reduce){.flash.on{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <img id="hlogo" alt="VAS">
    <button class="loc" id="locBtn">📍 <b id="locTxt">Đang lấy vị trí…</b></button>
    <button class="ib" id="setBtn" aria-label="Cài đặt">⚙</button>
  </div>
  <div class="stage" id="stage">
    <div class="vf" id="vf"><video id="vid" playsinline muted autoplay></video><canvas id="ov"></canvas><div class="flash" id="flash"></div></div>
    <div class="msg" id="msg"><div><b>Chưa mở được camera</b><span id="msgTxt">Hãy cho phép ứng dụng dùng camera rồi bấm thử lại.</span><div class="row" style="margin-top:16px"><button class="btn or" id="retry">Thử lại</button><button class="btn" id="useFile">Dùng camera của máy</button></div></div></div>
  </div>
  <div class="bar">
    <button class="thumb" id="thumb" aria-label="Ảnh vừa chụp"></button>
    <button class="shut" id="shut" aria-label="Chụp ảnh"></button>
    <button class="ib" id="flip" aria-label="Đổi camera">⟲</button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="panel">
  <h2>Cài đặt khung ảnh <button class="ib" id="closeSet" aria-label="Đóng">✕</button></h2>
  <label>Địa chỉ hiển thị
    <input type="text" id="addr" placeholder="Tự động theo GPS">
  </label>
  <div class="row"><button class="btn or" id="autoLoc">📍 Lấy địa chỉ tự động</button></div>
  <p class="small" id="locInfo"></p>
  <label>Ghi chú (không bắt buộc)<textarea id="note" placeholder="VD: Đo huyết áp đầu ca – Tổ lắp đặt"></textarea></label>
  <label>Chữ dưới logo<input type="text" id="comp" value="VAS ENERGY TECHNOLOGY"></label>
  <label class="chk"><input type="checkbox" id="autoSave" checked> Tự lưu ảnh ngay khi chụp</label>
  <label class="chk"><input type="checkbox" id="showCode" checked> Hiện mã xác thực dọc mép phải</label>
  <label class="chk"><input type="checkbox" id="showGps"> Hiện toạ độ GPS</label>
  <div class="row"><button class="btn" id="pickLib">Gắn khung cho ảnh có sẵn</button></div>
  <p class="small">Ảnh lưu vào thư mục Tải xuống (Download), xem được trong Bộ sưu tập / Google Photos.</p>
</div></div>

<div class="view" id="view"><img id="vimg" alt="Ảnh vừa chụp"><div class="row"><button class="btn" id="vSave">Lưu lại</button><button class="btn" id="vShare">Chia sẻ</button><button class="btn or" id="vClose">Chụp tiếp</button></div></div>
<input type="file" id="fCam" accept="image/*" capture="environment">
<input type="file" id="fLib" accept="image/*">
<div class="toast" id="toast"></div>

const $=id=>document.getElementById(id);
const store={get(k,d){try{return localStorage.getItem('vascam_'+k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem('vascam_'+k,v)}catch(e){}}};
const logo=new Image();logo.src=LOGO;$('hlogo').src=LOGO;
const WD=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const p2=n=>String(n).padStart(2,'0');
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)};
const makeCode=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<16;i++)s+=c[Math.floor(Math.random()*c.length)];return s};
let code=makeCode(),gps=null,geoAt=null,manual=store.get('manual','0')==='1',lastBlob=null,lastUrl=null,lastName='',facing='environment',stream=null;

['addr','note','comp'].forEach(k=>{const v=store.get(k,null);if(v!==null)$(k).value=v;$(k).addEventListener('input',()=>{store.set(k,$(k).value);if(k==='addr'){manual=true;store.set('manual','1')}refreshLoc();drawPreview()})});
['autoSave','showCode','showGps'].forEach(k=>{const v=store.get(k,null);if(v!==null)$(k).checked=v==='1';$(k).addEventListener('change',()=>{store.set(k,$(k).checked?'1':'0');drawPreview()})});
function refreshLoc(){$('locTxt').textContent=$('addr').value||(gps?`${gps.lat.toFixed(5)}, ${gps.lon.toFixed(5)}`:'Đang lấy vị trí…')}

function wrap(c,text,maxW){const words=text.split(/\s+/);const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function drawOverlay(c,W,H,d,code){
  const s=Math.min(W,H)/960;
  const F="'RC','Roboto Condensed',sans-serif";
  const sh=()=>{c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=5*s;c.shadowOffsetX=1*s;c.shadowOffsetY=1*s};
  const ns=()=>{c.shadowColor='transparent';c.shadowBlur=0;c.shadowOffsetX=0;c.shadowOffsetY=0};
  const x0=24*s;
  c.textBaseline='alphabetic';c.textAlign='left';c.fillStyle='#fff';sh();
  // --- logo VAS góc phải dưới (vị trí chữ "Timemark")
  const comp=$('comp').value.trim();
  const logoW=150*s,lh=logoW*logo.naturalHeight/logo.naturalWidth;
  const lyB=H-(comp?44:18)*s;
  c.shadowColor='rgba(255,255,255,.55)';c.shadowBlur=8*s;c.shadowOffsetX=0;c.shadowOffsetY=0;
  c.drawImage(logo,W-16*s-logoW,lyB-lh,logoW,lh);sh();
  if(comp){c.textAlign='right';let fs=19;c.font=`400 ${fs*s}px ${F}`;while(c.measureText(comp).width>logoW+40*s&&fs>11){fs--;c.font=`400 ${fs*s}px ${F}`}c.fillText(comp,W-16*s,H-18*s);c.textAlign='left'}
  const rightReserve=Math.max(logoW,comp?c.measureText(comp).width:0)+40*s;
  // --- địa chỉ (dòng cuối)
  const addr=$('addr').value.trim();
  c.font=`400 ${37*s}px ${F}`;
  let addrLines=addr?wrap(c,addr,W-x0-rightReserve):[];
  if(addrLines.length>2)addrLines=addrLines.slice(0,2);
  let yA=H-28*s;
  for(let i=addrLines.length-1;i>=0;i--){c.fillText(addrLines[i],x0+4*s,yA);yA-=44*s}
  let up=(Math.max(addrLines.length,1)-1)*40*s;
  if($('showGps').checked&&gps){c.font=`400 ${24*s}px ${F}`;c.fillText(`${gps.lat.toFixed(6)}, ${gps.lon.toFixed(6)}`,x0+4*s,H-28*s-up-40*s+6*s);up+=34*s}
  // --- giờ lớn
  const tBase=H-95*s-up;
  const tStr=p2(d.getHours())+':'+p2(d.getMinutes());
  c.font=`500 ${129*s}px 'BC','Barlow Condensed',${F}`;const TX=Math.min(1,208*s/c.measureText(tStr).width);c.save();c.translate(x0-2*s,tBase);c.scale(TX,1);c.fillText(tStr,0,0);c.restore();
  const tw=c.measureText(tStr).width*TX;
  // --- vạch xanh
  const bx=x0+tw+30*s;ns();c.fillStyle='#1e9bff';c.fillRect(bx,tBase-92*s,4*s,100*s);sh();c.fillStyle='#fff';
  // --- ngày + thứ
  c.font=`400 ${36*s}px ${F}`;
  c.fillText(`${d.getDate()} Tháng ${d.getMonth()+1},${d.getFullYear()}`,bx+19*s,tBase-66*s);
  c.fillText(WD[d.getDay()],bx+18*s,tBase+3*s);
  // --- ghi chú (trên giờ)
  const note=$('note').value.trim();
  if(note){
    c.font=`400 ${30*s}px ${F}`;
    const nl=wrap(c,note,W-x0*2-rightReserve).slice(0,3);
    let ny=tBase-120*s-(nl.length-1)*38*s;
    nl.forEach((l,i)=>c.fillText(l,x0+4*s,ny+i*38*s));
  }
  // --- mã dọc mép phải
  if($('showCode').checked){
    c.save();c.font=`400 ${21*s}px ${F}`;c.fillStyle='rgba(255,255,255,.92)';
    const txt=`©  ${code}    VAS Verified`;const tl=c.measureText(txt).width;
    c.translate(W-14*s,H*.44+tl/2);c.rotate(-Math.PI/2);c.fillText(txt,0,0);c.restore();
  }
  ns();
}

/* ---------- vị trí ---------- */
const clean=s=>(s||'').replace(/^(Thành phố|Tỉnh|Quận|Phường|Huyện|Xã|Thị xã|Thị trấn)\s+/i,'').trim();
const join=a=>a.filter((v,i,arr)=>v&&arr.indexOf(v)===i).join(', ');
async function getJSON(url){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),7000);try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}}
const providers=[
  async(la,lo)=>{const j=await getJSON(`https://photon.komoot.io/reverse?lat=${la}&lon=${lo}&lang=default`);const p=(j.features&&j.features[0]||{}).properties||{};
    const street=[p.housenumber,p.street].filter(Boolean).join(' ');return join([street||(p.name!==p.city?p.name:''),clean(p.district||p.locality||p.county),clean(p.city||p.state)])},
  async(la,lo)=>{const j=await getJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=vi&lat=${la}&lon=${lo}`);const a=j.address||{};
    return join([[a.house_number,a.road].filter(Boolean).join(' '),clean(a.quarter||a.suburb||a.city_district||a.county||a.town||a.village),clean(a.city||a.state)])},
  async(la,lo)=>{const j=await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=vi`);
    return join([clean(j.locality),clean(j.city||j.principalSubdivision)])}
];
async function geocode(force){
  if(!gps||(manual&&!force))return;
  geoAt={...gps};$('locInfo').textContent='Đang tra địa chỉ…';
  for(const p of providers){try{const s=await p(gps.lat,gps.lon);if(s&&s.split(',').length>=2){$('addr').value=s;store.set('addr',s);$('locInfo').textContent=`Toạ độ ${gps.lat.toFixed(5)}, ${gps.lon.toFixed(5)} (±${Math.round(gps.acc)}m)`;refreshLoc();drawPreview();return}}catch(e){}}
  $('locInfo').textContent='Không tra được địa chỉ (kiểm tra mạng). Có thể gõ tay ở trên.';
  if(!$('addr').value){$('addr').value='';refreshLoc()}
}
const dist=(a,b)=>{const R=6371e3,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
function startGeo(){
  if(!navigator.geolocation){$('locTxt').textContent='Máy không hỗ trợ định vị';return}
  navigator.geolocation.watchPosition(pos=>{
    gps={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy};
    if(!geoAt||dist(geoAt,gps)>120)geocode(false);
    refreshLoc();drawPreview();
  },err=>{if(!$('addr').value)$('locTxt').textContent='Chưa có vị trí – bật GPS và cho phép';},{enableHighAccuracy:true,maximumAge:30000,timeout:20000});
}
$('autoLoc').onclick=()=>{manual=false;store.set('manual','0');if(gps)geocode(true);else{toast('Đang chờ GPS…');startGeo()}};

/* ---------- camera ---------- */
const vid=$('vid'),ov=$('ov'),vf=$('vf');
async function startCam(){
  $('msg').classList.remove('on');
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:4096},height:{ideal:4096}}});
    vid.srcObject=stream;await vid.play();fit();
  }catch(e){$('msgTxt').textContent=location.protocol==='https:'?'Hãy cho phép ứng dụng dùng camera (biểu tượng ổ khoá trên thanh địa chỉ → Quyền) rồi bấm Thử lại.':'Camera chỉ chạy khi mở qua link https.';$('msg').classList.add('on')}
}
function fit(){
  const st=$('stage');const sw=st.clientWidth,sh=st.clientHeight;
  const vw=vid.videoWidth||3,vh=vid.videoHeight||4;const k=Math.min(sw/vw,sh/vh);
  vf.style.width=Math.round(vw*k)+'px';vf.style.height=Math.round(vh*k)+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);ov.width=Math.round(vw*k*dpr);ov.height=Math.round(vh*k*dpr);drawPreview();
}
function drawPreview(){const c=ov.getContext('2d');c.clearRect(0,0,ov.width,ov.height);if(ov.width)drawOverlay(c,ov.width,ov.height,new Date(),code)}
const ro=new ResizeObserver(fit);ro.observe($('stage'));vid.addEventListener('loadedmetadata',fit);vid.addEventListener('resize',fit);
setInterval(drawPreview,1000);

function fname(d){return `VAS_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}.jpg`}
function save(blob,name){
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
}
function finish(cv,d){
  cv.toBlob(b=>{
    lastBlob=b;lastName=fname(d);if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(b);
    $('thumb').style.backgroundImage=`url(${lastUrl})`;
    if($('autoSave').checked){save(b,lastName);toast('Đã lưu ảnh')}else{$('vimg').src=lastUrl;$('view').classList.add('on')}
    code=makeCode();drawPreview();
  },'image/jpeg',0.92);
}
$('shut').onclick=()=>{
  if(!stream||!vid.videoWidth){$('fCam').click();return}
  const d=new Date(),W=vid.videoWidth,H=vid.videoHeight;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  c.drawImage(vid,0,0,W,H);drawOverlay(c,W,H,d,code);
  const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');
  if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}
  finish(cv,d);
};
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};
$('retry').onclick=startCam;
$('useFile').onclick=()=>$('fCam').click();
$('pickLib').onclick=()=>$('fLib').click();
['fCam','fLib'].forEach(id=>$(id).addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;e.target.value='';
  const d=new Date(id==='fCam'?Date.now():(f.lastModified||Date.now()));
  const im=new Image();im.onload=()=>{const MAX=4096;let W=im.naturalWidth,H=im.naturalHeight;const k=Math.min(1,MAX/Math.max(W,H));W=Math.round(W*k);H=Math.round(H*k);
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');c.drawImage(im,0,0,W,H);drawOverlay(c,W,H,d,code);$('sheet').classList.remove('on');finish(cv,d)};
  im.src=URL.createObjectURL(f);
}));
$('thumb').onclick=()=>{if(!lastUrl)return;$('vimg').src=lastUrl;$('view').classList.add('on')};
$('vClose').onclick=()=>$('view').classList.remove('on');
$('vSave').onclick=()=>{if(lastBlob){save(lastBlob,lastName);toast('Đã lưu ảnh')}};
$('vShare').onclick=async()=>{if(!lastBlob)return;const f=new File([lastBlob],lastName,{type:'image/jpeg'});try{await navigator.share({files:[f]})}catch(e){if(e.name!=='AbortError')toast('Máy không hỗ trợ chia sẻ')}};
$('setBtn').onclick=()=>$('sheet').classList.add('on');
$('locBtn').onclick=()=>$('sheet').classList.add('on');
$('closeSet').onclick=()=>$('sheet').classList.remove('on');
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))$('sheet').classList.remove('on')});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}else startCam()});

refreshLoc();
Promise.all(['400 40px RC','500 40px BC'].map(f=>document.fonts.load(f,'0123456789ThángChủ nhật'))).catch(()=>{}).then(drawPreview);
logo.onload=drawPreview;
startCam();startGeo();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
