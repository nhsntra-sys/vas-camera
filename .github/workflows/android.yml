name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Signing key
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS_SECRET: ${{ secrets.KS_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_SECRET" ]; then
            echo "$KS_B64" | base64 -d > $RUNNER_TEMP/release.jks
            echo "KS_PASS=$KS_PASS_SECRET" >> $GITHUB_ENV
          else
            KS_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$KS_PASS"
            echo "KS_PASS=$KS_PASS" >> $GITHUB_ENV
            keytool -genkeypair -keystore $RUNNER_TEMP/release.jks -alias vas -keyalg RSA -keysize 2048 -validity 10000 -storepass $KS_PASS -keypass $KS_PASS -dname "CN=VAS Energy Technology, O=VAS, C=VN"
          fi
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Build
        working-directory: android
        env: { VCODE: '${{ github.run_number }}' }
        run: gradle --no-daemon :app:assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk VAS-Camera.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: VAS Camera 2.0.${{ github.run_number }}
          make_latest: 'true'
          files: VAS-Camera.apk
